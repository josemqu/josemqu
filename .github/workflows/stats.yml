name: Update GitHub stats cards

on:
  # Corre cada 6 horas
  schedule:
    - cron: "0 */6 * * *"

  # Permite disparar manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: "Download stats card (compact, theme tokyonight)"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          mkdir -p assets

          if [[ "$GH_TOKEN" == github_pat_* ]]; then
            AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          else
            AUTH_HEADER="Authorization: token $GH_TOKEN"
          fi

          # Stats compactas con theme tokyonight (texto legible, fondo oscuro)
          curl -sSL \
            -H "$AUTH_HEADER" \
            -H "User-Agent: github-actions-stats-bot" \
            "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=josemqu&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true" \
            -o assets/github-stats.svg

          size=$(stat -c%s assets/github-stats.svg)
          echo "github-stats.svg -> ${size} bytes"
          if [ "$size" -lt 200 ]; then
            echo "::error::Respuesta demasiado pequena:"
            head -c 500 assets/github-stats.svg
            exit 1
          fi

      - name: "Download top languages card (most-commit-language: barras horizontales)"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [[ "$GH_TOKEN" == github_pat_* ]]; then
            AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          else
            AUTH_HEADER="Authorization: token $GH_TOKEN"
          fi

          # Barras horizontales (no donut) -> mejor proporcion y lectura
          curl -sSL \
            -H "$AUTH_HEADER" \
            -H "User-Agent: github-actions-stats-bot" \
            "https://github-profile-summary-cards.vercel.app/api/cards/most-commit-language?username=josemqu&theme=tokyonight&hide_border=true&exclude=CSS,HTML&langsCount=5" \
            -o assets/top-langs.svg

          size=$(stat -c%s assets/top-langs.svg)
          echo "top-langs.svg -> ${size} bytes"
          if [ "$size" -lt 200 ]; then
            echo "::error::Respuesta demasiado pequena:"
            head -c 500 assets/top-langs.svg
            exit 1
          fi

      - name: Show final summary
        run: |
          echo "=== Archivos generados ==="
          ls -la assets/
          for f in assets/*.svg; do
            file "$f"
          done

      - name: Commit and push updated assets
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f assets/*.svg

          if git diff --cached --quiet; then
            echo "Sin cambios respecto al ultimo commit, nada que hacer."
            exit 0
          fi

          echo "=== Cambios detectados ==="
          git status --short

          git commit -m "chore(assets): refresh GitHub stats cards"

          echo "=== Haciendo push ==="
          if git push 2>&1 | tee /tmp/push.log; then
            echo "Push exitoso."
          else
            echo "::error::git push fallo. Log completo:"
            cat /tmp/push.log
            exit 1
          fi