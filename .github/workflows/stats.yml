name: Update GitHub stats cards

on:
  # Corre cada 6 horas
  schedule:
    - cron: "0 */6 * * *"

  # Permite disparar manualmente desde la pestaña Actions
  workflow_dispatch:

  # Re-corre cada vez que se modifica este archivo
  push:
    paths:
      - ".github/workflows/stats.yml"

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write   # Necesario para hacer commit de las imágenes

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Download stats card (general) via profile-summary-cards
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          mkdir -p assets

          # Auto-detectar tipo de token (clásico vs fine-grained)
          if [[ "$GH_TOKEN" == github_pat_* ]]; then
            AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          else
            AUTH_HEADER="Authorization: token $GH_TOKEN"
          fi

          curl -sSL \
            -H "$AUTH_HEADER" \
            -H "User-Agent: github-actions-stats-bot" \
            "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=josemqu&theme=transparent&hide_border=true&include_all_commits=true&count_private=true" \
            -o assets/github-stats.svg

          size=$(stat -c%s assets/github-stats.svg)
          echo "github-stats.svg → ${size} bytes"

          if [ "$size" -lt 200 ]; then
            echo "::error::La respuesta es demasiado pequeña (${size} bytes), probable error:"
            head -c 500 assets/github-stats.svg
            exit 1
          fi

      - name: Download top languages card via profile-summary-cards
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [[ "$GH_TOKEN" == github_pat_* ]]; then
            AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          else
            AUTH_HEADER="Authorization: token $GH_TOKEN"
          fi

          curl -sSL \
            -H "$AUTH_HEADER" \
            -H "User-Agent: github-actions-stats-bot" \
            "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=josemqu&theme=transparent&hide_border=true&exclude=CSS,HTML" \
            -o assets/top-langs.svg

          size=$(stat -c%s assets/top-langs.svg)
          echo "top-langs.svg → ${size} bytes"

          if [ "$size" -lt 200 ]; then
            echo "::error::La respuesta es demasiado pequeña (${size} bytes), probable error:"
            head -c 500 assets/top-langs.svg
            exit 1
          fi

      - name: Show final summary
        run: |
          echo "=== Archivos generados ==="
          ls -la assets/
          for f in assets/*.svg; do
            file "$f"
          done

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que commitear."
          else
            git commit -m "chore(assets): refresh GitHub stats cards"
            git push
          fi